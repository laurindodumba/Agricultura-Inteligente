services:
  - type: web
    name: recomendacultura-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://creative-cassata-54a155.netlify.app
